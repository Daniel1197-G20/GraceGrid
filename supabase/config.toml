# Supabase CLI project configuration
project_id = "gracegrid"

[api]
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[functions.super-task]
verify_jwt = false

[functions.join-waitlist]
verify_jwt = false

[functions.send-phase-update]
verify_jwt = false

[auth]
enabled = true
site_url = "https://grace-grid.vercel.app"
additional_redirect_urls = [
  "https://grace-grid.vercel.app/**",
  "https://grace-grid.vercel.app/admin",
  "https://grace-grid.vercel.app",
  "http://localhost:5173/**",
  "http://localhost:5173",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

